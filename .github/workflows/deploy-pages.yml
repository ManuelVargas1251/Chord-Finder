name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - master

permissions:
  contents: write

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Prepare Pages site
        run: |
          rm -rf site
          mkdir site
          cp index.html site/
          cp -R src site/

      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: site
          clean-exclude: |
            pr-preview/
          force: false