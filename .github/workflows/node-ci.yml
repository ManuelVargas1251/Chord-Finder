name: Node.js CI

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - development
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  test-coverage-and-build:
    name: Test, Coverage, and Build 📊
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: test-results
        run: |
          start_time=$(date +%s%3N)
          set +e
          npm test
          exit_code=$?
          end_time=$(date +%s%3N)
          echo "duration-ms=$((end_time - start_time))" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Upload coverage report
        if: always()
        id: coverage-artifact
        uses: actions/upload-artifact@v6
        with:
          name: chord-finder-coverage-run-${{ github.run_number }}
          path: coverage/
          if-no-files-found: error

      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
          TEST_DURATION_MS: ${{ steps.test-results.outputs.duration-ms }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'))
            const testResults = JSON.parse(fs.readFileSync('coverage/test-results.json', 'utf8'))
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            const totals = summary.total
            const thresholds = packageJson.jest.coverageThreshold.global
            const passed = Object.entries(thresholds).every(([metric, threshold]) =>
              totals[metric].pct >= threshold
            )
            const status = passed ? 'passing' : 'failing'
            const badgeColor = passed ? 'brightgreen' : 'red'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const badge = `[![Coverage ${status}](https://img.shields.io/badge/coverage-${status}-${badgeColor})](<${runUrl}>)`
            const format = metric => `${metric.pct}%`
            const formatCoverage = result => `${format(result)} (${result.covered}/${result.total})`
            const coverageRow = (fileName, coverage) => `| ${fileName} | ${formatCoverage(coverage.statements)} | ${formatCoverage(coverage.branches)} | ${formatCoverage(coverage.functions)} | ${formatCoverage(coverage.lines)} |`
            const coverageRows = [...Object.entries(summary)
              .filter(([filePath]) => filePath !== 'total')
              .sort(([firstPath], [secondPath]) => firstPath.localeCompare(secondPath))
              .map(([filePath, coverage]) => coverageRow(`\`${path.relative(process.cwd(), filePath).replaceAll('\\', '/').replace(/^src\/js\//, '/') }\``, coverage)),
              coverageRow('**Total**', totals)
            ].join('\n')
            const testDurationMs = Number(process.env.TEST_DURATION_MS)
            const testDuration = Number.isFinite(testDurationMs)
              ? `${(testDurationMs / 1000).toFixed(3)}s`
              : 'Unavailable'
            const testResultsRow = `| ${testResults.numPassedTestSuites} passed / ${testResults.numTotalTestSuites} total | ${testResults.numPassedTests} passed / ${testResults.numTotalTests} total | ${testResults.snapshot.total} total | ${testDuration} |`
            const artifactsUrl = process.env.COVERAGE_ARTIFACT_URL
            const artifactLink = artifactsUrl
              ? `[Download the full coverage report 📂](<${artifactsUrl}>)`
              : 'The full coverage report artifact is unavailable.'
            const commitSha = context.payload.pull_request.head.sha
            const chartImageUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${commitSha}/docs/ci-workflows.png`
            const chartSourceUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${commitSha}/docs/ci-workflows.md`
            const marker = '<!-- chord-finder-coverage -->'
            const body = `${marker}
            ## Test & Coverage Results 🧪📊
            ${badge} [![Tested with Jest](https://img.shields.io/badge/tested%20with-Jest-99424f.svg)](https://jestjs.io/)

            | Test Suites🪎 | Tests⚗️ | Snapshots🤳 | Duration⏱️ |
            | ---: | ---: | ---: | ---: |
            ${testResultsRow}

            | File 📜 | Statements🫆 | Branches🪸 | Functions📟 | Lines🥢 |
            | --- | ---: | ---: | ---: | ---: |
            ${coverageRows}

            [View the CI workflow chart (PNG) 🖼️](<${chartImageUrl}>)
            [View the CI workflow chart (Desktop) 🖥️](<${chartSourceUrl}>)

            ${artifactLink}


            🕊️`

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            })
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              })
            }

      - name: Build bundle
        run: npm run build
