name: Node.js CI

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - development
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  test-coverage-and-build:
    name: Test, Coverage, and Build 📊
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chord-finder-coverage
          path: coverage/
          if-no-files-found: warn

      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'))
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            const totals = summary.total
            const thresholds = packageJson.jest.coverageThreshold.global
            const passed = Object.entries(thresholds).every(([metric, threshold]) =>
              totals[metric].pct >= threshold
            )
            const status = passed ? 'passing' : 'failing'
            const badgeColor = passed ? 'brightgreen' : 'red'
            const badge = `![Coverage ${status}](https://img.shields.io/badge/coverage-${status}-${badgeColor})`
            const format = metric => `${metric.pct}%`
            const metrics = [
              ['Statements', 'statements'],
              ['Branches', 'branches'],
              ['Functions', 'functions'],
              ['Lines', 'lines']
            ]
            const coverageRows = metrics.map(([label, metric]) => {
              const result = totals[metric]
              const metricStatus = result.pct >= thresholds[metric] ? 'Pass' : 'Fail'
              return `| ${label} | ${format(result)} | ${result.covered} / ${result.total} | ${thresholds[metric]}% | ${metricStatus} |`
            }).join('\n')
            const artifactsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts`
            const commitSha = context.payload.pull_request.head.sha
            const chartImageUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${commitSha}/docs/ci-workflows.png`
            const chartSourceUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${commitSha}/docs/ci-workflows.md`
            const chartSource = fs.readFileSync('docs/ci-workflows.mmd', 'utf8').trim()
            const marker = '<!-- chord-finder-coverage -->'
            const body = `${marker}
            ## Coverage Report 📊
            ${badge}

            | Metric 📏 | Coverage 📈 | Covered 🔢 | Threshold 🎯 | Status ✅ |
            | --- | ---: | ---: | ---: | --- |
            ${coverageRows}

            [Download the full coverage report](<${artifactsUrl}>)

            ![CI workflow overview](<${chartImageUrl}>)

            [View the Mermaid chart source](<${chartSourceUrl}>)

            <details>
            <summary>View Mermaid source</summary>

            \`\`\`mermaid
            ${chartSource}
            \`\`\`

            </details>

            Generated by Node.js CI.`

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            })
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              })
            }

      - name: Build bundle
        run: npm run build
